[project]
name = "molab-admet"
version = "0.1.0"
description = "ADMET notebook project"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.2.2",
    "anywidget>=0.11.0",
    "marimo>=0.15.4",
    "marimo-chem-utils>=0.2.4",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "polars>=1.44.1",
    "pyarrow>=25.0.1",
    "rdkit>=2026.3.6",
    "shap>=0.52.0",
    "traitlets>=5.16.1",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openadmet_tdi"]

[tool.marimo.runtime]
auto_instantiate = false
auto_reload = "autorun"

[tool.marimo.save]
format_on_save = "true"

[dependency-groups]
dev = [
    "watchfiles>=1.3.0",
]
